services:
  mongodb:
    image: mongo:7
    container_name: userly-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - userly-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: userly-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGO_URI=${MONGO_URI}
      - USERS_COLLECTION_NAME=Users
      - ACCOUNTS_COLLECTION_NAME=Accounts
      - UPDATE_CRON=0 0 12 * * *
      - NODE_ENV=production
      - SYSTEM_NAME=userly
      - SERVICE_NAME=userly-es
      - DESCRIPTION=tracking user data
      - SOURCE_TIMEOUT=10000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - userly-network
  
    backend:
    build:
      context: ./read-be
      dockerfile: Dockerfile
    container_name: userly-read-backend
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - MONGO_URI=${MONGO_URI}
      - USERS_VIEW_COLLECTION_NAME = users_view
      - ACCOUNTS_VIEW_COLLECTION_NAME = accounts_view
      - UPDATE_CRON=0 0 12 * * *
      - NODE_ENV=production
      - SYSTEM_NAME=userly
      - SERVICE_NAME=userly-es
      - DESCRIPTION=tracking user data
      - SOURCE_TIMEOUT=10000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - userly-network

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3001/api
    container_name: userly-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - userly-network

volumes:
  mongodb_data:
    driver: local

networks:
  userly-network:
    driver: bridge